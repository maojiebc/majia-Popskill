name: Apply reviewed UI sources
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/ui-workspace.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.number == 8 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'gpt/secondary-ui-20260905'
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply checksum-verified source edits
        run: |
          python3 - <<'PY'
          import base64, bz2, hashlib, json
          from pathlib import Path
          root = Path.cwd()
          encoded = ''.join((root / f'.ui-edit-{i}.txt').read_text() for i in range(3))
          raw = bz2.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'fb9958da04b0cdbefefb47a2dbd505f19eb103023facbc79208f9d9b92bdb97c'
          for name, spec in json.loads(raw).items():
              # Workflow changes are submitted through the authorized connector, not GITHUB_TOKEN.
              if name.startswith('.github/workflows/'): continue
              path = (root / name).resolve()
              assert root in path.parents
              old = path.read_bytes() if path.exists() else b''
              assert hashlib.sha256(old).hexdigest() == spec['sha256'], name
              if 'catalog' in spec:
                  data = json.loads(old)
                  data['strings'].update(spec['catalog'])
                  for key in spec['remove']: data['strings'].pop(key, None)
                  data['strings'] = dict(sorted(data['strings'].items()))
                  new = json.dumps(data, ensure_ascii=False, indent=2) + '\n'
              else:
                  lines = old.decode().splitlines(True)
                  for start, end, text in reversed(spec['edits']): lines[start:end] = [text]
                  new = ''.join(lines)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(new)
              print('Applied', name)
          for i in range(3): (root / f'.ui-edit-{i}.txt').unlink()
          PY
      - name: Select Xcode and generate catalog artifacts
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode_16*.app | sort | tail -n 1)"
          sudo xcode-select -s "$XCODE_PATH"
          export DEVELOPER_DIR="$XCODE_PATH/Contents/Developer"
          scripts/gen-l10n.sh
          scripts/gen-l10n.sh --check
          for f in scripts/*.sh; do bash -n "$f"; done
      - name: Commit application sources only
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          BRANCH='gpt/secondary-ui-20260905'
          ACTUAL="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          test "$ACTUAL" = "$EXPECTED_HEAD"
          git add -A
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
          git -c user.name='Popskill UI refactor' -c user.email='74524515+maojiebc@users.noreply.github.com' commit -m 'feat: rebuild native settings and explicit maintenance workflows'
          git push origin "HEAD:refs/heads/$BRANCH"
          git rev-parse HEAD
      - name: Build and test applied sources
        run: |
          set -euo pipefail
          swift build -c release --package-path swift-app -Xswiftc -strict-concurrency=complete 2>&1 | tee /tmp/ui-build.log
          ! grep -q 'warning:' /tmp/ui-build.log
          swift test --package-path swift-app 2>&1 | tee /tmp/ui-test.log
          for lang in zh-Hans en; do
            POPSKILL_UI_SNAPSHOT_DIR="$RUNNER_TEMP/popskill-ui" POPSKILL_UI_SNAPSHOT_LANG="$lang" swift test --skip-build --package-path swift-app --filter SecondaryUISnapshotTests
          done
      - name: Native render and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-apply-evidence
          path: |
            /tmp/ui-build.log
            /tmp/ui-test.log
            ${{ runner.temp }}/popskill-ui
          if-no-files-found: ignore
          retention-days: 3
